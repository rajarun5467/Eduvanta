services:
  - type: web
    name: educollege
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # set manually from MongoDB Atlas
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromRenderService:
          type: web
          name: educollege
          property: url
